<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtDent — Panel de Control</title>
    <style>
        :root {
            --ad-blue: #397B9C;
            --ad-green: #5AAD9C;
            --ad-teal: #49949C;
            --ad-light: #DAE6F0;
            --dark-bg: #1A202C;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f4f8;
            color: #333;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--ad-blue);
        }

        .header img { height: 40px; }
        .header h2 { margin: 0; color: var(--ad-blue); font-weight: 800; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ad-teal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="number"], select {
            padding: 10px;
            border: 2px solid var(--ad-light);
            border-radius: 8px;
            width: 100%;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, var(--ad-blue), var(--ad-teal));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        button.btn-test {
            background: var(--ad-green);
            padding: 6px 12px;
            font-size: 0.75rem;
            width: auto;
        }

        #log-container {
            background: var(--dark-bg);
            color: #A0AEC0;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
        }

        .log-entry { border-bottom: 1px solid #2D3748; padding: 2px 0; }
        .log-time { color: var(--ad-green); margin-right: 8px; }
        .error { color: #FC8181; }
        .info { color: #63B3ED; }

        .status-bar {
            font-size: 0.75rem;
            text-align: center;
            color: #718096;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icon.png" alt="Logo">
        <h2>ArtDent <span style="font-weight: 300; color: var(--ad-green);">Print</span></h2>
    </div>

    <div class="card">
        <div class="card-title">⚙️ Configuración General</div>
        
        <div class="form-group" style="margin-top: 15px;">
            <label for="portInput">Puerto del Servidor:</label>
            <input type="number" id="portInput" placeholder="1234">
        </div>

        <div class="form-group">
            <label for="printerSelect">Impresora de Tickets:</label>
            <select id="printerSelect">
                <option value="">-- Usar predeterminada de Windows --</option>
            </select>
        </div>

        <button onclick="saveConfig()">Guardar Configuración</button>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📋 Monitor de Actividad</div>
            <button class="btn-test" onclick="sendTestPrint()">Imprimir Test</button>
        </div>
        <div id="log-container"></div>
        <div class="status-bar">Servicio activo en Formosa, Argentina</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const logContainer = document.getElementById('log-container');
        const portInput = document.getElementById('portInput');
        const printerSelect = document.getElementById('printerSelect');

        // Pedir datos iniciales al arrancar
        ipcRenderer.send('get-initial-data');

        ipcRenderer.on('initial-data', (event, data) => {
            portInput.value = data.port;
            
            // Limpiar y llenar el selector de impresoras
            printerSelect.innerHTML = '<option value="">-- Usar predeterminada de Windows --</option>';
            data.printers.forEach(printer => {
                const option = document.createElement('option');
                option.value = printer.name;
                option.textContent = printer.name + (printer.isDefault ? ' (Predeterminada)' : '');
                if (printer.name === data.printerName) {
                    option.selected = true;
                }
                printerSelect.appendChild(option);
            });

            updateLogUI(data.logs);
        });

        ipcRenderer.on('update-logs', (event, logs) => updateLogUI(logs));

        function updateLogUI(logs) {
            logContainer.innerHTML = logs.map(l => `
                <div class="log-entry">
                    <span class="log-time">[${l.time}]</span>
                    <span class="${l.type}">${l.message}</span>
                </div>
            `).join('');
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function saveConfig() {
            const data = {
                port: parseInt(portInput.value),
                printerName: printerSelect.value
            };

            if (data.port > 1024 && data.port < 65535) {
                ipcRenderer.send('save-config', data);
                alert("Configuración guardada satisfactoriamente. Reinicie el servicio para aplicar cambios de puerto.");
            } else {
                alert("Por favor, ingrese un puerto válido.");
            }
        }

        function sendTestPrint() {
            ipcRenderer.send('print-test-ticket');
        }
    </script>
</body>

</html>
