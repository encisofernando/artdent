    <style>
      /* Splash de arranque: cubre el hueco en blanco mientras baja el bundle y
         la config remota. Se quita apenas React monta (window.hideAppSplash en
         main.tsx); no espera a "cargar todo". Las rutas prerenderizadas no lo
         traen: el snapshot se toma con la app ya montada. */
      #app-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#124C69;transition:opacity .3s ease,visibility .3s ease}
      #app-splash.is-hidden{opacity:0;visibility:hidden}
      #app-splash img{width:176px;height:auto;animation:app-splash-in .6s ease-out both,app-splash-pulse 1.8s ease-in-out .6s infinite}
      #app-splash .app-splash-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
      #app-splash .app-splash-bar span{display:block;width:40%;height:100%;border-radius:3px;background:#fff;animation:app-splash-bar 1.1s ease-in-out infinite}
      @keyframes app-splash-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
      @keyframes app-splash-pulse{0%,100%{opacity:1}50%{opacity:.82}}
      @keyframes app-splash-bar{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
      @media (prefers-reduced-motion:reduce){#app-splash img,#app-splash .app-splash-bar span{animation:none}}
    </style>

    <script>
      (function () {
        var el = document.getElementById('app-splash')
        var start = Date.now()
        var MIN_VISIBLE_MS = 400
        function remove() {
          if (!el || !el.parentNode) return
          el.classList.add('is-hidden')
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el) }, 320)
        }
        window.hideAppSplash = function () {
          setTimeout(remove, Math.max(0, MIN_VISIBLE_MS - (Date.now() - start)))
        }
        // Navegador automatizado (prerender): sin splash.
        if (el && navigator.webdriver) { el.parentNode.removeChild(el); el = null }
        // Red de seguridad: si la app no llega a montar, no dejar la pantalla tapada.
        setTimeout(remove, 10000)
      })()
    </script>
