<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#165a77" />
    <title>Sin conexión | ArtDent Shop</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #165a77 0%, #0b3142 100%);
        color: #f8fafc;
        font-family: Montserrat, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(100%, 480px);
        border-radius: 28px;
        background: rgba(11, 49, 66, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 32px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(4, 19, 28, 0.38);
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(248, 250, 252, 0.82);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa/icon-192.png" alt="ArtDent Shop" />
      <h1>Sin conexión</h1>
      <p>La tienda instalada sigue disponible, pero necesitás conexión para cargar el catálogo más reciente y finalizar compras.</p>
    </main>
  </body>
</html>
