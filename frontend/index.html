<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA / Installable ─────────────────────────────────────────────── -->
    <!-- Colorea la barra del browser en Android/Chrome -->
    <meta name="theme-color" content="#397B9C" />

    <!-- FIX: versión moderna (reemplaza la deprecated apple-mobile-web-app-capable) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS: mantener también la versión Apple para Safari en iPhone/iPad -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArtDent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- El manifest.webmanifest lo inyecta vite-plugin-pwa automáticamente -->

    <!-- SEO básico -->
    <meta name="description" content="ArtDent – Sistema de gestión para laboratorio dental" />
    <meta name="robots" content="noindex, nofollow" />

    <title>ArtDent – Back Office</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
